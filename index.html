<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Shapefiles!</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container" id="gridContainer"></div>

    <div class="sidebar" id="sidebar">
        <div class="utility-group">

            <button id="share" class="control-btn share-btn" aria-label="Open Share QR Code" title="Share App">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <!-- Standard outward diagonal share arrow path -->
                    <path fill="currentColor"
                        d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z" />
                </svg>
            </button>
            <!-- The button contains the accessible label; the inner SVG is hidden from assistive tech -->
            <button id="reset" class="control-btn reset-btn" aria-label="Reset Filter Layout" title="Reset Layout">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <!-- Standard circular reset loop path -->
                    <path fill="currentColor"
                        d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                </svg>
            </button>
        </div>
        <button class="control-btn type-btn human-readable-data-file" id="human-readable-data-file">Text</button>
        <button class="control-btn type-btn machine-readable-data-file" id="machine-readable-data-file">Binary</button>
        <button class="control-btn type-btn display-tile" id="display-tile">Tile</button>
        <button class="control-btn type-btn database" id="database">Database</button>

    </div>
    <div id="qrModal" class="modal-overlay">
        <div class="modal-content">
            <img src="images/qrcode-no-shapefiles.png" alt="Scan to share app">
            <p>Tap or click anywhere to close</p>
        </div>
    </div>

    <script type="module" src="index.js"></script>
</body>

</html>
